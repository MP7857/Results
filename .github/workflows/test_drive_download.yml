name: Test Drive download
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/test_drive_download.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Download
        run: |
          set -euxo pipefail
          curl -L --fail --retry 2 -o source.zip 'https://drive.usercontent.google.com/download?id=1MVkkwkmQhJGt5fnd4M0leRWtx9ri-OvV&export=download&confirm=t'
          file source.zip
          ls -lh source.zip
          unzip -t source.zip | tail -5
      - uses: actions/upload-artifact@v4
        with:
          name: drive-test
          path: source.zip
